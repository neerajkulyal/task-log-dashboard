<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Log — Manager Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="board">

  <header class="board__header">
    <div class="header__title">
      <span class="header__eyebrow">MAINCRAFTS · INTERNAL OPS</span>
      <h1>Task Log</h1>
    </div>
    <div class="header__stats" id="stats">
      <div class="stat">
        <span class="stat__value" id="statTotal">0</span>
        <span class="stat__label">logged</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="statOpen">0</span>
        <span class="stat__label">open</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="statDone">0</span>
        <span class="stat__label">closed</span>
      </div>
    </div>
  </header>

  <section class="entry-bar">
    <input
      type="text"
      id="taskInput"
      class="entry-bar__input"
      placeholder="Log a new task… e.g. Finish assignment"
      maxlength="140"
      autocomplete="off"
    >
    <button id="addBtn" class="btn btn--primary">
      <span>File Entry</span>
    </button>
  </section>

  <div class="entry-bar__hint" id="inputHint" aria-live="polite"></div>

  <section class="control-bar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5"/>
        <path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchBox" placeholder="Search the log…" autocomplete="off">
    </div>

    <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="Filter tasks">
      <button class="filter-tab is-active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-tab" data-filter="pending" role="tab" aria-selected="false">Open</button>
      <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Closed</button>
    </div>
  </section>

  <section class="ledger" aria-live="polite">
    <div class="ledger__head">
      <span class="col col--stamp">Status</span>
      <span class="col col--task">Entry</span>
      <span class="col col--time">Filed</span>
      <span class="col col--actions">Actions</span>
    </div>
    <ul id="taskList" class="ledger__body"></ul>
    <div id="emptyState" class="empty-state">
      <div class="empty-state__mark">—</div>
      <p class="empty-state__title">The log is empty</p>
      <p class="empty-state__body">File your first entry above to start the ledger.</p>
    </div>
  </section>

  <footer class="board__footer">
    <span>Stored locally in this browser · nothing leaves your machine</span>
  </footer>

</div>

<template id="taskRowTemplate">
  <li class="ledger__row" data-id="">
    <div class="col col--stamp">
      <button class="stamp-btn" data-action="toggle" aria-label="Toggle status">
        <span class="stamp"></span>
      </button>
    </div>
    <div class="col col--task">
      <span class="task-index"></span>
      <span class="task-text" data-action="text"></span>
      <input class="task-edit-input" type="text" maxlength="140">
    </div>
    <div class="col col--time">
      <span class="task-time"></span>
    </div>
    <div class="col col--actions">
      <button class="icon-btn icon-btn--edit" data-action="edit" title="Edit" aria-label="Edit task">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M11.3 2.3a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1 0 1.4l-7.6 7.6-3 .7.7-3 7.5-7.7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn icon-btn--save" data-action="save" title="Save" aria-label="Save task">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn icon-btn--delete" data-action="delete" title="Delete" aria-label="Delete task">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 4.5h9M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5l.6 8a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </li>
</template>

<script src="script.js"></script>
</body>
</html>
